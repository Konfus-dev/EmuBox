<?xml version="1.0"?>
<!-- Adds "Store" to Batocera's home screen. Its entries are the scripts in /userdata/roms/store. -->
<systemList>
  <system>
    <fullname>Store</fullname>
    <name>store</name>
    <manufacturer>EmuBox</manufacturer>
    <release>None</release>
    <hardware>port</hardware>
    <path>/userdata/roms/store</path>
    <extension>.sh</extension>
    <command>emulatorlauncher %CONTROLLERSCONFIG% -system ports -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
    <platform>pc</platform>
    <theme>store</theme>
    <emulators>
      <emulator name="sh">
        <cores>
          <core default="true">sh</core>
        </cores>
      </emulator>
    </emulators>
  </system>
</systemList>
