<?xml version="1.0"?>
<!-- Adds "Captures" to Batocera's home screen: your screenshots and recordings, in two folders
     (roms/captures/Screenshots and roms/captures/Recordings lead to /userdata/screenshots and
     /userdata/recordings, where Batocera saves them). Opened with Batocera's own image and video
     viewer, as its "Screenshots" entry is; that entry is hidden so they do not show twice. -->
<systemList>
  <system>
    <fullname>Captures</fullname>
    <name>captures</name>
    <manufacturer>EmuBox</manufacturer>
    <release>None</release>
    <hardware>system</hardware>
    <path>/userdata/roms/captures</path>
    <extension>.jpg .jpeg .png .bmp .gif .mkv .mp4 .avi .webm</extension>
    <command>emulatorlauncher %CONTROLLERSCONFIG% -system imageviewer -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
    <platform>imageviewer</platform>
    <theme>captures</theme>
  </system>
</systemList>
