# EmuBox: Batocera on the PC's own disk (partition with filesystem id @BOOT_UUID@).
# The kernel is read from Batocera's partition, so Batocera's own updates apply. emubox.cpio (built
# into this loader) adds a step that restores /boot/boot-custom.sh when an update removed it.
# USB drives are started from the firmware's boot menu, not from here.
set args="console=tty3 quiet loglevel=0 vt.global_cursor_default=0 @EXTRA_ARGS@"
if search --no-floppy --fs-uuid --set=root @BOOT_UUID@; then
    echo "Starting EmuBox..."
    linux /boot/linux uuid=@BOOT_UUID@ rdinit=/emubox-init $args
    initrd /boot/initrd.gz (memdisk)/emubox.cpio
    boot
fi
echo "EmuBox's partition (@BOOT_UUID@) was not found on this PC."
echo "Going back to the boot menu in 10 seconds."
sleep 10
exit
